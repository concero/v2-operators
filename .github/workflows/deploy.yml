name: Deploy Concero Relayer

on:
  push:
    branches:
      - mainnet
      - testnet
      - stage

jobs:
  deploy:
    name: Deploy Relayer
    runs-on: ubuntu-latest

    steps:
      - name: Define environment
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            mainnet)
              echo "ENV=MAINNET" >> $GITHUB_OUTPUT
              echo "GIT_BRANCH=origin/mainnet" >> $GITHUB_OUTPUT
              ;;
            testnet)
              echo "ENV=TESTNET" >> $GITHUB_OUTPUT
              echo "GIT_BRANCH=origin/testnet" >> $GITHUB_OUTPUT
              ;;
            stage)
              echo "ENV=STAGE" >> $GITHUB_OUTPUT
              echo "GIT_BRANCH=origin/stage" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unsupported branch"
              exit 1
              ;;
          esac

      - name: Export SSH secrets
        run: |
          case "${{ steps.env.outputs.ENV }}" in
            MAINNET)
              echo "SSH_HOST=${{ secrets.MAINNET_SSH_HOST }}" >> $GITHUB_ENV
              echo "SSH_USER=${{ secrets.MAINNET_SSH_USER }}" >> $GITHUB_ENV
              echo "SSH_KEY=${{ secrets.MAINNET_SSH_KEY }}" >> $GITHUB_ENV
              echo "SSH_PORT=${{ secrets.MAINNET_SSH_PORT }}" >> $GITHUB_ENV
              ;;
            TESTNET)
              echo "SSH_HOST=${{ secrets.TESTNET_SSH_HOST }}" >> $GITHUB_ENV
              echo "SSH_USER=${{ secrets.TESTNET_SSH_USER }}" >> $GITHUB_ENV
              echo "SSH_KEY=${{ secrets.TESTNET_SSH_KEY }}" >> $GITHUB_ENV
              echo "SSH_PORT=${{ secrets.TESTNET_SSH_PORT }}" >> $GITHUB_ENV
              ;;
            STAGE)
              echo "SSH_HOST=${{ secrets.STAGE_SSH_HOST }}" >> $GITHUB_ENV
              echo "SSH_USER=${{ secrets.STAGE_SSH_USER }}" >> $GITHUB_ENV
              echo "SSH_KEY=${{ secrets.STAGE_SSH_KEY }}" >> $GITHUB_ENV
              echo "SSH_PORT=${{ secrets.STAGE_SSH_PORT }}" >> $GITHUB_ENV
              ;;
          esac

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            echo "🚀 Deploying Concero Relayer → ${{ steps.env.outputs.ENV }}"
            cd /root/relayer
            git fetch --all
            git reset --hard ${{ steps.env.outputs.GIT_BRANCH }}
            docker compose --env-file .env -f docker/docker-compose.yml up --build -d
            echo "✅ Done at $(date)"