name: Deploy Concero Relayer

on:
  push:
    branches:
      - mainnet
      - testnet
      - stage

jobs:
  deploy:
    name: Deploy Relayer
    runs-on: ubuntu-latest

    steps:
      - name: Set environment variables
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "mainnet" ]]; then
            echo "ENV_PREFIX=MAINNET" >> $GITHUB_OUTPUT
            echo "GIT_BRANCH=origin/mainnet" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "testnet" ]]; then
            echo "ENV_PREFIX=TESTNET" >> $GITHUB_OUTPUT
            echo "GIT_BRANCH=origin/testnet" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "stage" ]]; then
            echo "ENV_PREFIX=STAGE" >> $GITHUB_OUTPUT
            echo "GIT_BRANCH=origin/stage" >> $GITHUB_OUTPUT
          else
            echo "Unsupported branch"
            exit 1
          fi

      - name: Export SSH secrets
        run: |
          echo "SSH_HOST=${{ secrets[format('{0}_SSH_HOST', steps.env.outputs.ENV_PREFIX)] }}" >> $GITHUB_ENV
          echo "SSH_USER=${{ secrets[format('{0}_SSH_USER', steps.env.outputs.ENV_PREFIX)] }}" >> $GITHUB_ENV
          echo "SSH_KEY=${{ secrets[format('{0}_SSH_KEY', steps.env.outputs.ENV_PREFIX)] }}" >> $GITHUB_ENV
          echo "SSH_PORT=${{ secrets[format('{0}_SSH_PORT', steps.env.outputs.ENV_PREFIX)] }}" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            echo "🚀 Deploying Concero Relayer → ${{ steps.env.outputs.ENV_PREFIX }}"
            cd /root/relayer
            git fetch --all
            git reset --hard ${{ steps.env.outputs.GIT_BRANCH }}
            docker compose --env-file .env -f docker/docker-compose.yml up --build -d
            echo "✅ ${{ steps.env.outputs.ENV_PREFIX }} done at $(date)"
