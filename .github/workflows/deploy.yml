name: Deploy Concero Relayer

on:
  push:
    branches:
      - mainnet
      - testnet
      - stage

jobs:
  deploy:
    name: Deploy Relayer
    runs-on: ubuntu-latest

    steps:
      # ----------------- Checkout -----------------
      - name: Checkout repository
        uses: actions/checkout@v4
      # ----------------- Define environment -----------------
      - name: Define environment
        id: env
        run: |
          if [ "${GITHUB_REF}" == "refs/heads/mainnet" ]; then
            ENV=mainnet
          elif [ "${GITHUB_REF}" == "refs/heads/testnet" ]; then
            ENV=testnet
          elif [ "${GITHUB_REF}" == "refs/heads/stage" ]; then
            ENV=stage
          else
            echo "❌ Unsupported branch"
            exit 1
          fi
          echo "env=$ENV" >> $GITHUB_OUTPUT

      # ----------------- Define branch -----------------
      - name: Define branch
        id: branch
        run: |
          if [ "${{ steps.env.outputs.env }}" == "mainnet" ]; then
            echo "branch=mainnet" >> $GITHUB_OUTPUT
          elif [ "${{ steps.env.outputs.env }}" == "testnet" ]; then
            echo "branch=testnet" >> $GITHUB_OUTPUT
          else
            echo "branch=stage" >> $GITHUB_OUTPUT
          fi
      # ---------- TESTNET DEPLOY ----------
      - name: Deploy to TESTNET
        if: steps.env.outputs.env == 'testnet'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TESTNET_SSH_HOST }}
          username: ${{ secrets.TESTNET_SSH_USER }}
          key: ${{ secrets.TESTNET_SSH_KEY }}
          port: ${{ secrets.TESTNET_SSH_PORT }}
          script: |
            echo "🚀 Deploying Concero Relayer → TESTNET"
            cd /root/relayer
            git fetch --all
            git reset --hard origin/testnet
            docker compose --env-file .env -f docker/docker-compose.yml up --build -d
            echo "✅ TESTNET done at $(date)"

      # ---------- STAGE DEPLOY ----------
      - name: Deploy to STAGE
        if: steps.env.outputs.env == 'stage'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGE_SSH_HOST }}
          username: ${{ secrets.STAGE_SSH_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          port: ${{ secrets.STAGE_SSH_PORT }}
          script: |
            echo "🚀 Deploying Concero Relayer → STAGE"
            cd /root/relayer
            git fetch --all
            git reset --hard origin/stage
            docker compose --env-file .env -f docker/docker-compose.yml up --build -d
            echo "✅ STAGE done at $(date)"

      # ---------- MAINNET DEPLOY ----------
      - name: Deploy to MAINNET
        if: steps.env.outputs.env == 'mainnet'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MAINNET_SSH_HOST }}
          username: ${{ secrets.MAINNET_SSH_USER }}
          key: ${{ secrets.MAINNET_SSH_KEY }}
          port: ${{ secrets.MAINNET_SSH_PORT }}
          script: |
            echo "🚀 Deploying Concero Relayer → MAINNET"
            cd /root/relayer
            git fetch --all
            git reset --hard origin/mainnet
            docker compose --env-file .env -f docker/docker-compose.yml up --build -d
            echo "✅ MAINNET done at $(date)"
