name: Deploy Concero Relayer

on:
  push:
    branches:
      - mainnet
      - testnet
      - stage

jobs:
  deploy:
    name: Deploy Relayer
    runs-on: ubuntu-latest

    steps:
      # ----------------- Checkout -----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------- Define environment -----------------
      - name: Define environment
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            mainnet)
              echo "ENV=MAINNET" >> $GITHUB_OUTPUT
              echo "GIT_BRANCH=origin/mainnet" >> $GITHUB_OUTPUT
              ;;
            testnet)
              echo "ENV=TESTNET" >> $GITHUB_OUTPUT
              echo "GIT_BRANCH=origin/testnet" >> $GITHUB_OUTPUT
              ;;
            stage)
              echo "ENV=STAGE" >> $GITHUB_OUTPUT
              echo "GIT_BRANCH=origin/stage" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Unsupported branch"
              exit 1
              ;;
          esac

      # ----------------- Create temporary SSH key file -----------------
      - name: Write SSH key to temp file
        id: sshkey
        run: |
          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"

          case "${{ steps.env.outputs.ENV }}" in
            MAINNET)
              echo "${{ secrets.MAINNET_KEY }}" > "$KEY_FILE"
              ;;
            TESTNET)
              echo "${{ secrets.TESTNET_KEY }}" > "$KEY_FILE"
              ;;
            STAGE)
              echo "${{ secrets.STAGE_KEY }}" > "$KEY_FILE"
              ;;
          esac

          echo "KEY_FILE=$KEY_FILE" >> $GITHUB_OUTPUT

      # ----------------- Deploy via SSH -----------------
      - name: Deploy via SSH
        run: |
          case "${{ steps.env.outputs.ENV }}" in
            MAINNET)
              HOST=${{ secrets.MAINNET_HOST }}
              USER=${{ secrets.MAINNET_USER }}
              PORT=${{ secrets.MAINNET_PORT }}
              ;;
            TESTNET)
              HOST=${{ secrets.TESTNET_HOST }}
              USER=${{ secrets.TESTNET_USER }}
              PORT=${{ secrets.TESTNET_PORT }}
              ;;
            STAGE)
              HOST=${{ secrets.STAGE_HOST }}
              USER=${{ secrets.STAGE_USER }}
              PORT=${{ secrets.STAGE_PORT }}
              ;;
          esac

          ssh -i "${{ steps.sshkey.outputs.KEY_FILE }}" -p "$PORT" "$USER@$HOST" << 'EOF'
          echo "🚀 Deploying Concero Relayer → ${{ steps.env.outputs.ENV }}"
          cd /root/relayer
          git fetch --all
          git reset --hard ${{ steps.env.outputs.GIT_BRANCH }}
          docker compose --env-file .env -f docker/docker-compose.yml up --build -d
          echo "✅ ${{ steps.env.outputs.ENV }} done at $(date)"