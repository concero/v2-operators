version: "3.8"

services:
  app:
    container_name: relayer
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    env_file:
      - ./../.env
      - ./../.env.production
    volumes:
      - relayer_logs:/app/logs
    environment:
      NODE_ENV: production
    restart: always
  adminer:
    image: adminer:5.4.0-fastcgi
    ports:
      - ${DB_ADMINER_PORT}:8080


volumes:
  relayer_logs:
    name: relayer_logs
