  postgres:
    image: postgres:16
    container_name: ${DATABASE_HOST}
    hostname: ${DATABASE_HOST}
    restart: always
    ports:
      - "${DATABASE_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: relayer_db
    volumes:
      - relayer_db:/var/lib/postgresql/data

volumes:
  relayer_logs:
    name: relayer_logs
  relayer_db:
    name: relayer_db
