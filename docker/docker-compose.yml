version: "3.8"

services:
  app:
    container_name: relayer
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    env_file:
      - ./../.env
      - ./../.env.production
    volumes:
      - relayer_logs:/app/logs
      - relayer_db:/app/prisma/db
    environment:
      NODE_ENV: production
    restart: always


volumes:
  relayer_logs:
    name: relayer_logs
  relayer_db:
    name: relayer_db
